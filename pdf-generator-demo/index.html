<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF Generator App</title>
    <!-- Include pdfmake libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 50px; text-align: center; }
        button { padding: 15px 30px; font-size: 16px; background-color: #004488; color: white; border: none; cursor: pointer; border-radius: 5px; }
        button:hover { background-color: #002244; }
    </style>
</head>
<body>

    <h2>Monthly Analysis Dashboard</h2>
    <button onclick="fetchDataAndGeneratePDF()">Generate Exact Report PDF</button>

    <script>
        // Helper function to generate star strings based on a number
        function getStars(rating) {
            const fullStar = '★';
            const emptyStar = '☆';
            return fullStar.repeat(rating) + emptyStar.repeat(Math.max(0, 5 - rating));
        }

        // Helper function to get exact colors based on status
        function getStatusColor(status) {
            if (status === 'Completed') return '#27AE60'; // Green
            if (status === 'In Progress') return '#F39C12'; // Orange
            return '#E74C3C'; // Red
        }

        async function fetchDataAndGeneratePDF() {
            // 1. Fetch analyzed data from your backend
            const response = await fetch('http://localhost:3000/api/report-data');
            const data = await response.json();

            // 2. Map the data into pdfmake's table row format
            const tableRows = data.map(item => [
                { text: item.feature_name, margin: [0, 5, 0, 5] },
                { text: item.status, color: getStatusColor(item.status), bold: true, margin: [0, 5, 0, 5] },
                { text: getStars(item.rating), color: '#F1C40F', fontSize: 14, margin: [0, 5, 0, 5] },
                { text: item.notes, color: '#7F8C8D', italics: true, margin: [0, 5, 0, 5] }
            ]);

            // Add the table headers to the very beginning of the rows array
            tableRows.unshift([
                { text: 'Feature', color: 'white', fillColor: '#004488', bold: true },
                { text: 'Status', color: 'white', fillColor: '#004488', bold: true },
                { text: 'Rating', color: 'white', fillColor: '#004488', bold: true },
                { text: 'Notes', color: 'white', fillColor: '#004488', bold: true }
            ]);

            // 3. Define the exact document structure
            const docDefinition = {
                pageSize: 'A4',
                pageMargins: [40, 100, 40, 60],
                
                // EXACT LETTERHEAD
                header: function() {
                    return {
                        columns: [
                            {
                                text: 'YOUR COMPANY NAME\nData Analytics Division\ncontact@yourcompany.com',
                                margin: [40, 20, 0, 0],
                                color: '#333333'
                            },
                            {
                                text: 'DATA REPORT', // Replace with an image object for actual logos
                                alignment: 'right',
                                margin: [0, 20, 40, 0],
                                fontSize: 18,
                                bold: true,
                                color: '#004488'
                            }
                        ],
                        canvas: [{ type: 'line', x1: 40, y1: 80, x2: 555, y2: 80, lineWidth: 2, lineColor: '#004488' }]
                    };
                },

                // MAIN CONTENT
                content: [
                    { text: 'Q3 Analytics Overview', fontSize: 22, bold: true, alignment: 'center', margin: [0, 0, 0, 10] },
                    
                    // THE DYNAMIC TABLE
                    {
                        table: {
                            headerRows: 1,
                            widths: ['*', 'auto', 'auto', '*'],
                            body: tableRows
                        },
                        layout: {
                            hLineWidth: function (i) { return 1; },
                            vLineWidth: function (i) { return 0; }, // Invisible vertical borders
                            hLineColor: function (i) { return '#E5E7E9'; },
                            paddingTop: function(i) { return 5; },
                            paddingBottom: function(i) { return 5; }
                        }
                    }
                ]
            };

            // 4. Generate the PDF
            pdfMake.createPdf(docDefinition).download('Exact_Analyzed_Report.pdf');
        }
    </script>
</body>
</html>
